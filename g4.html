<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مراجعة الصف الرابع الابتدائي — أ. تامر النجار | أكاديمي ICT</title>
  <style>
    :root {
      --bg-main: #070d1f; --bg-card: #0e1830; --bg-card-alt: #142142; --bg-sidebar: #0a1226;
      --text-main: #f6f3ea; --text-muted: #9fb0cf;
      --accent: #f5c04a; --accent-2: #ffd97a; --on-accent: #1a1405;
      --success: #34d399; --success-bg: rgba(52,211,153,.14);
      --danger: #fb7185; --danger-bg: rgba(251,113,133,.14);
      --warning: #f5c04a; --warning-bg: rgba(245,192,74,.15);
      --border: rgba(245,192,74,.16); --glow: rgba(245,192,74,.25);
      --hero: linear-gradient(135deg,#0b1a3d 0%,#10265a 55%,#0b1a3d 100%);
      --font-scale: 1;
    }
    body.light-mode {
      --bg-main: #f4f1e8; --bg-card: #ffffff; --bg-card-alt: #f7f3e6; --bg-sidebar: #ffffff;
      --text-main: #0f1b3d; --text-muted: #51607f;
      --accent: #b8860b; --accent-2: #8a6508; --on-accent: #ffffff;
      --success: #0f9d6b; --success-bg: rgba(15,157,107,.1);
      --danger: #d6334f; --danger-bg: rgba(214,51,79,.09);
      --warning: #b8860b; --warning-bg: rgba(184,134,11,.12);
      --border: rgba(15,27,61,.12); --glow: rgba(184,134,11,.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: calc(16px * var(--font-scale)); }
    body {
      font-family: 'Cairo','Inter',sans-serif; color: var(--text-main); line-height: 1.7; min-height: 100vh; overflow-x: hidden;
      background: radial-gradient(1200px 600px at 85% -10%, rgba(245,192,74,.10), transparent 60%),
                  radial-gradient(900px 500px at 0% 20%, rgba(56,110,255,.12), transparent 60%), var(--bg-main);
      background-attachment: fixed;
    }
    .topbar {
      position: sticky; top: 0; z-index: 50; background: var(--hero); color:#fff;
      border-bottom: 2px solid #f5c04a; padding: .6rem 1.25rem 0; box-shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    .top-row { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem; padding-bottom:.55rem; }
    .brand-block { display:flex; align-items:center; gap:.85rem; }
    .logo { width:48px; height:48px; border-radius:14px; display:grid; place-items:center; font-weight:900; font-size:1.05rem; color:#1a1405;
      background: linear-gradient(135deg,#ffe08a,#f5c04a 55%,#c8921a); box-shadow:0 4px 14px rgba(245,192,74,.45); flex:none; font-family:'Inter',sans-serif; }
    .portrait { width:70px; height:70px; border-radius:50%; padding:3px; flex:none; background:linear-gradient(135deg,#ffe08a,#f5c04a 55%,#c8921a); box-shadow:0 4px 16px rgba(245,192,74,.5); }
    .portrait img { width:100%; height:100%; border-radius:50%; display:block; border:2px solid #0b1a3d; }
    .acad { display:inline-flex; align-items:center; gap:.35rem; margin-inline-start:.4rem; font-weight:900; font-size:.78rem; color:#1a1405; background:linear-gradient(135deg,#ffe08a,#f5c04a); padding:.1rem .6rem; border-radius:999px; font-family:'Inter','Cairo',sans-serif; }
    .brand-badge { display:inline-block; background: rgba(245,192,74,.16); border:1px solid rgba(245,192,74,.5); color:#ffd97a; font-weight:800; padding:.1rem .65rem; border-radius:999px; font-size:.78rem; white-space:nowrap; margin-bottom:.15rem; }
    .brand-titles h1 { font-size:1.02rem; font-weight:900; line-height:1.35; color:#fff; }
    .brand-titles p { font-size:.8rem; color:#c5d1ea; font-weight:600; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:.4rem; }
    .btn { font-family:'Cairo',sans-serif; font-weight:700; font-size:.8rem; padding:.42rem .75rem; border-radius:10px;
      border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.08); color:#fff; cursor:pointer; display:inline-flex; align-items:center; gap:.3rem; transition:all .18s ease; }
    .btn:hover { background:rgba(255,255,255,.2); transform:translateY(-2px); }
    .btn:active { transform:scale(.96); }
    .btn.active { background:#f5c04a; color:#1a1405; border-color:#f5c04a; }
    .btn-success { background:rgba(52,211,153,.2); border-color:rgba(52,211,153,.55); color:#a7f3d0; }
    .btn-warning { background:rgba(245,192,74,.2); border-color:rgba(245,192,74,.6); color:#ffe08a; }

    .stats { display:flex; flex-wrap:wrap; align-items:center; gap:.6rem 1rem; padding:.45rem 0 .6rem; border-top:1px solid rgba(255,255,255,.1); }
    .stat { display:flex; align-items:center; gap:.4rem; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); padding:.12rem .7rem; border-radius:999px; font-weight:800; font-size:.85rem; }
    .stat b { color:#ffd97a; font-size:1.05rem; font-variant-numeric:tabular-nums; }
    .stat.streak.hot { background:linear-gradient(90deg,#f97316,#f5c04a); color:#1a1405; border-color:transparent; animation:pulse 1s ease infinite; }
    .stat.streak.hot b { color:#1a1405; }
    .progress-wrap { flex:1; min-width:220px; display:flex; align-items:center; gap:.6rem; font-size:.8rem; font-weight:700; color:#c5d1ea; }
    .progress { flex:1; height:12px; background:rgba(255,255,255,.12); border-radius:999px; overflow:hidden; }
    .progress > i { display:block; height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#c8921a,#f5c04a,#ffe08a); transition:width .6s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px rgba(245,192,74,.7); }

    .layout { display:grid; grid-template-columns:320px 1fr; min-height:calc(100vh - var(--hdr,178px)); }
    .layout.sidebar-hidden { grid-template-columns:1fr; }
    .layout.sidebar-hidden .sidebar { display:none; }
    .sidebar { background:var(--bg-sidebar); border-left:1px solid var(--border); padding:1rem; position:sticky; top:var(--hdr,178px); height:calc(100vh - var(--hdr,178px)); overflow-y:auto; }
    .search-box { width:100%; padding:.65rem .9rem; border-radius:12px; border:1px solid var(--border); background:var(--bg-card-alt); color:var(--text-main); font-family:'Cairo',sans-serif; font-size:.88rem; margin-bottom:.85rem; outline:none; transition:.2s; }
    .search-box:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--glow); }
    .unit-group { margin-bottom:1rem; }
    .unit-label { font-size:.76rem; font-weight:800; color:var(--accent); padding:.25rem .4rem; margin-bottom:.35rem; border-bottom:1px solid var(--border); }
    .nav-item { width:100%; text-align:right; background:transparent; border:1px solid transparent; color:var(--text-main); padding:.5rem .7rem; border-radius:10px; font-family:'Cairo',sans-serif; font-size:.82rem; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:.4rem; margin-bottom:.25rem; transition:all .15s ease; }
    .nav-item:hover { background:var(--bg-card-alt); transform:translateX(-3px); }
    .nav-item.active { background:linear-gradient(90deg,rgba(245,192,74,.2),rgba(245,192,74,.05)); border-color:var(--accent); color:var(--accent); font-weight:800; }
    .nav-tag { font-size:.72rem; opacity:.85; white-space:nowrap; background:var(--bg-card-alt); padding:0 .45rem; border-radius:999px; }
    .nav-tag.done { background:var(--success-bg); color:var(--success); }

    .main-content { padding:1.5rem; max-width:1200px; width:100%; margin:0 auto; animation:pageIn .45s ease; }
    .page-header { background:var(--hero); color:#fff; border:1px solid rgba(245,192,74,.4); border-radius:20px; padding:1.3rem 1.6rem; margin-bottom:1.25rem; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:1rem; box-shadow:0 14px 34px rgba(0,0,0,.25); position:relative; overflow:hidden; }
    .page-header::after { content:""; position:absolute; width:260px; height:260px; left:-80px; top:-120px; background:radial-gradient(circle,rgba(245,192,74,.35),transparent 70%); }
    .page-title-wrap { position:relative; z-index:1; }
    .page-title-wrap h2 { font-size:1.4rem; font-weight:900; color:#fff; }
    .sub-meta { display:flex; flex-wrap:wrap; gap:.5rem; margin-top:.4rem; }
    .chip { font-size:.76rem; font-weight:700; padding:.2rem .65rem; border-radius:999px; background:rgba(245,192,74,.14); color:var(--accent); border:1px solid rgba(245,192,74,.32); }
    .page-header .chip { color:#ffd97a; }
    .chip.purple { background:rgba(255,255,255,.1); color:#dbe5fb; border-color:rgba(255,255,255,.22); }
    .page-actions { display:flex; flex-wrap:wrap; gap:.5rem; position:relative; z-index:1; }
    .action-btn { font-family:'Cairo',sans-serif; font-weight:700; font-size:.85rem; padding:.5rem 1rem; border-radius:12px; border:1px solid var(--border); background:var(--bg-card-alt); color:var(--text-main); cursor:pointer; transition:all .15s ease; }
    .action-btn:hover:not(:disabled) { border-color:var(--accent); color:var(--accent); transform:translateY(-2px); }
    .action-btn:disabled { opacity:.4; cursor:default; }
    .action-btn.primary { background:linear-gradient(135deg,#ffe08a,#f5c04a 60%,#d9a02a); color:#1a1405; border-color:#f5c04a; box-shadow:0 4px 14px rgba(245,192,74,.35); }
    .action-btn.primary:hover:not(:disabled) { color:#1a1405; box-shadow:0 6px 20px rgba(245,192,74,.55); }

    .section-banner { background:linear-gradient(270deg,rgba(245,192,74,.16),rgba(245,192,74,.03)); border-right:5px solid var(--accent); padding:.7rem 1.1rem; border-radius:12px; margin:1.4rem 0 .9rem; font-weight:800; font-size:1rem; display:flex; align-items:center; justify-content:space-between; gap:.5rem; }

    .q-card { background:var(--bg-card); border:1px solid var(--border); border-radius:18px; padding:1.2rem 1.4rem; margin-bottom:1rem; transition:border-color .2s, box-shadow .25s, transform .25s; animation:cardIn .5s ease both; position:relative; }
    .q-card:hover { border-color:rgba(245,192,74,.5); box-shadow:0 10px 28px rgba(0,0,0,.2); transform:translateY(-2px); }
    .q-card.solved { border-color:var(--success); box-shadow:0 0 0 1px var(--success), 0 8px 24px rgba(52,211,153,.12); }
    .q-card.missed { animation:shake .4s; }
    .q-top { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:.7rem; }
    .q-badge { background:linear-gradient(135deg,#ffe08a,#f5c04a); color:#1a1405; font-weight:800; font-size:.78rem; padding:.18rem .7rem; border-radius:999px; white-space:nowrap; }
    .q-status { font-weight:800; font-size:.85rem; }
    .q-status.ok { color:var(--success); } .q-status.no { color:var(--danger); }
    .q-en { direction:ltr; text-align:left; font-family:'Inter','Cairo',sans-serif; font-weight:700; font-size:1.03rem; margin-bottom:.35rem; }
    .q-ar { direction:rtl; text-align:right; font-weight:700; font-size:1.03rem; }

    .choices-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:.6rem; margin:.85rem 0; }
    .choice-item { background:var(--bg-card-alt); border:2px solid var(--border); border-radius:14px; padding:.65rem .85rem; font-size:.92rem; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:.5rem; cursor:pointer; text-align:right; font-family:inherit; color:var(--text-main); transition:all .18s ease; }
    .choice-item:hover:not(.locked) { border-color:var(--accent); transform:translateY(-2px) scale(1.01); box-shadow:0 6px 16px var(--glow); }
    .choice-item .key { display:inline-grid; place-items:center; width:1.7rem; height:1.7rem; border-radius:50%; background:rgba(245,192,74,.18); color:var(--accent); font-weight:900; margin-inline-end:.45rem; font-family:'Inter',sans-serif; }
    .choice-item.correct-highlight { background:var(--success-bg); border-color:var(--success); color:var(--success); font-weight:800; animation:pop .45s; }
    .choice-item.wrong { background:var(--danger-bg); border-color:var(--danger); color:var(--danger); }

    .tf-row { display:flex; gap:.7rem; margin:.7rem 0 .2rem; }
    .tf-btn { flex:1; max-width:200px; font-family:'Cairo',sans-serif; font-weight:900; font-size:1.05rem; padding:.55rem 1rem; border-radius:14px; border:2px solid var(--border); background:var(--bg-card-alt); color:var(--text-main); cursor:pointer; transition:all .18s ease; }
    .tf-btn:hover:not(.locked) { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 16px var(--glow); }
    .tf-btn.correct-highlight { background:var(--success-bg); border-color:var(--success); color:var(--success); animation:pop .45s; }
    .tf-btn.wrong { background:var(--danger-bg); border-color:var(--danger); color:var(--danger); }
    .locked { cursor:default; }

    .answer-toggle-row { display:flex; align-items:center; justify-content:space-between; margin-top:.7rem; padding-top:.7rem; border-top:1px dashed var(--border); }
    .reveal-btn { font-family:'Cairo',sans-serif; font-weight:800; font-size:.86rem; padding:.42rem .95rem; border-radius:10px; border:1px solid rgba(52,211,153,.5); background:var(--success-bg); color:var(--success); cursor:pointer; transition:.15s; }
    .reveal-btn:hover { transform:translateY(-2px); }
    .answer-box { display:none; margin-top:.75rem; background:var(--success-bg); border:1px solid rgba(52,211,153,.4); border-right:5px solid var(--success); border-radius:12px; padding:.85rem 1.1rem; }
    .answer-box.visible { display:block; animation:fadeIn .3s ease; }
    .ans-en { direction:ltr; text-align:left; font-family:'Inter','Cairo',sans-serif; font-weight:700; font-size:.98rem; margin-bottom:.35rem; }
    .ans-ar { direction:rtl; text-align:right; font-weight:700; font-size:.95rem; }

    .bottom-nav { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-top:1.5rem; padding-top:1rem; border-top:1px solid var(--border); }

    .timer-bar { display:none; position:fixed; bottom:16px; left:16px; z-index:60; background:var(--bg-card); border:2px solid var(--warning); border-radius:18px; padding:.7rem 1.1rem; box-shadow:0 12px 30px rgba(0,0,0,.4); align-items:center; gap:.75rem; }
    .timer-bar.active { display:flex; animation:pop .4s; }
    .timer-bar.low { border-color:var(--danger); } .timer-bar.low .timer-digits { color:var(--danger); animation:pulse .6s infinite; }
    .timer-digits { font-size:1.6rem; font-weight:900; color:var(--warning); font-variant-numeric:tabular-nums; }

    #toast { position:fixed; top:200px; left:50%; transform:translate(-50%,-20px); z-index:80; padding:.7rem 1.6rem; border-radius:999px; font-weight:900; font-size:1.15rem; opacity:0; pointer-events:none; transition:all .3s; background:linear-gradient(135deg,#ffe08a,#f5c04a); color:#1a1405; box-shadow:0 10px 30px rgba(245,192,74,.5); }
    #toast.show { opacity:1; transform:translate(-50%,0); }
    #toast.bad { background:linear-gradient(135deg,#fecdd3,#fb7185); box-shadow:0 10px 30px rgba(251,113,133,.4); }
    #fxCanvas { position:fixed; inset:0; z-index:70; pointer-events:none; }
    #drawCanvas { display:none; position:fixed; inset:0; z-index:75; pointer-events:none; }
    #drawCanvas.drawing-active { display:block; pointer-events:auto; cursor:crosshair; }

    @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:none} }
    @keyframes pageIn { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    @keyframes cardIn { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
    @keyframes pop { 0%{transform:scale(.92)} 60%{transform:scale(1.06)} 100%{transform:scale(1)} }
    @keyframes pulse { 50%{transform:scale(1.07)} }
    @keyframes shake { 20%,60%{transform:translateX(-7px)} 40%,80%{transform:translateX(7px)} }
    @media (max-width:900px) { .layout{grid-template-columns:1fr} .sidebar{position:static;height:auto;border-left:none;border-bottom:1px solid var(--border)} }
    @media (prefers-reduced-motion: reduce) { *{animation:none!important;transition:none!important} }

    let currentIndex = 0, fontScale = 1, penEnabled = false, isDrawing = false, timerInterval = null;

    function getQuestionUid(pageId, secIdx, qIdx) { return `${pageId}__${secIdx}__${qIdx}`; }
    const allUids = [];
    PAGES_DATA.forEach(p => p.sections.forEach((s, si) => s.questions.forEach((q, qi) => { if (!q.nokey) allUids.push(getQuestionUid(p.id, si, qi)); })));
    const pageUids = (p) => { const a = []; p.sections.forEach((s, si) => s.questions.forEach((q, qi) => { if (!q.nokey) a.push(getQuestionUid(p.id, si, qi)); })); return a; };
    const isDone = (u) => revealedIds.has(u) || answered.has(u);

    function renderSidebar(filterText = "") {
      const navList = document.getElementById("navList");
      const q = filterText.trim().toLowerCase();
      const groups = new Map();
      PAGES_DATA.forEach((p, idx) => {
        const matches = !q || p.id.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) || p.unit.toLowerCase().includes(q) ||
          p.sections.some(sec => sec.questions.some(it => it.en.toLowerCase().includes(q) || it.ar.toLowerCase().includes(q) || (it.ansEn || "").toLowerCase().includes(q) || (it.ansAr || "").toLowerCase().includes(q)));
        if (!matches) return;
        if (!groups.has(p.unit)) groups.set(p.unit, []);
        groups.get(p.unit).push({ page: p, idx });
      });
      let html = "";
      for (const [unitName, items] of groups.entries()) {
        html += `<div class="unit-group"><div class="unit-label">${unitName}</div>`;
        for (const { page, idx } of items) {
          const us = pageUids(page);
          const d = us.filter(isDone).length;
          html += `<button class="nav-item ${idx === currentIndex ? "active" : ""}" onclick="selectPage(${idx})">
              <span>${page.title}</span><span class="nav-tag ${us.length && d === us.length ? "done" : ""}">${us.length && d === us.length ? "✓ " : ""}${page.sections.reduce((n, sc) => n + sc.questions.length, 0)} س</span></button>`;
        }

    }

    function cardHtml(page, secIdx, qIdx, qItem, delay) {
      const uid = getQuestionUid(page.id, secIdx, qIdx);
      const isRevealed = revealedIds.has(uid);
      const a = answered.get(uid);
      let interact = "";
      if (qItem.type === "mcq" && Array.isArray(qItem.choices)) {
        interact = `<div class="choices-grid">` + qItem.choices.map(c => {
          const showCorrect = (isRevealed || a) && c.key === qItem.correctKey;
          const isWrong = a && !a.ok && a.choice === c.key;
          return `<button class="choice-item ${showCorrect ? "correct-highlight" : ""} ${isWrong ? "wrong" : ""} ${(a || isRevealed) ? "locked" : ""}" onclick="pickChoice('${uid}','${c.key}',this)">
            <span><span class="key">${c.key}</span>${c.text}</span>${showCorrect ? "<span>✔</span>" : isWrong ? "<span>✘</span>" : ""}</button>`;
        }).join("") + `</div>`;
      } else if (qItem.type === "tf") {
        const right = qItem.ansEn.trim().startsWith("✓") ? "T" : "F";
        const cls = (k) => ((isRevealed || a) && right === k ? "correct-highlight" : "") + (a && !a.ok && a.choice === k ? " wrong" : "") + ((a || isRevealed) ? " locked" : "");
        interact = `<div class="tf-row"><button class="tf-btn ${cls("T")}" onclick="pickChoice('${uid}','T',this)">✓ صح</button><button class="tf-btn ${cls("F")}" onclick="pickChoice('${uid}','F',this)">✗ خطأ</button></div>`;
      }
      if (qItem.nokey) {
        const tl = qItem.lbl ? qItem.lbl : qItem.type === "mcq" ? "اختيار من متعدد" : qItem.type === "tf" ? "صح / خطأ" : "مقالي / مسألة";
        const opts = qItem.type === "mcq" && Array.isArray(qItem.choices) ? `<div class="choices-grid">` + qItem.choices.map(c => `<div class="choice-item locked"><span><span class="key">${c.key}</span>${c.text}</span></div>`).join("") + `</div>` : "";
        return `<article class="q-card" id="card-${uid}" style="${delay<0 ? "animation:none" : "animation-delay:" + delay + "ms"}">
          <div class="q-top"><span class="q-badge">${qItem.num ? "سؤال " + qItem.num + " •" : "•"} ${tl}</span></div>
          <div class="q-texts"><div class="q-en">${qItem.num ? qItem.num + ". " : ""}${qItem.en}</div>${qItem.ar ? `<div class="q-ar">${qItem.num ? qItem.num + "- " : ""}${qItem.ar}</div>` : ""}</div>
          ${opts}
          <div class="answer-toggle-row"><span class="chip">لا يوجد مفتاح إجابة لهذا السؤال في الملف الأصلي</span></div>
        </article>`;
      }
      const typeLabel = qItem.lbl ? qItem.lbl : qItem.type === "mcq" ? "اختيار من متعدد" : qItem.type === "tf" ? "صح / خطأ" : "مقالي / مسألة";
      const status = a ? (a.ok ? `<span class="q-status ok">🎉 أحسنت!</span>` : `<span class="q-status no">حاول تاني في السؤال الجاي 💪</span>`) : "";
      return `<article class="q-card ${a && a.ok ? "solved" : ""}" id="card-${uid}" style="${delay<0 ? "animation:none" : "animation-delay:" + delay + "ms"}">
          <div class="q-top"><span class="q-badge">${qItem.num ? "سؤال " + qItem.num + " •" : "•"} ${typeLabel}</span>${qItem.draft ? `<span class="q-badge" style="background:#7a3b00;color:#ffd9a0">📝 إجابة وترجمة مقترحة</span>` : ""}${status}</div>
          <div class="q-texts"><div class="q-en">${qItem.num ? qItem.num + ". " : ""}${qItem.en}</div>${qItem.ar ? `<div class="q-ar">${qItem.num ? qItem.num + "- " : ""}${qItem.ar}</div>` : ""}</div>
          ${interact}
          <div class="answer-toggle-row"><button class="reveal-btn" onclick="toggleAnswer('${uid}')">${isRevealed ? "إخفاء الإجابة" : "إظهار الإجابة النموذجية"}</button></div>
          <div class="answer-box ${isRevealed ? "visible" : ""}" id="ans-${uid}">${qItem.draft ? `<div class="chip" style="margin-bottom:6px">📝 إجابة مقترحة — ليست من مفتاح الإجابة الأصلي، للمراجعة</div>` : ""}<div class="ans-en">${qItem.ansEn}</div><div class="ans-ar">${qItem.ansAr}</div></div>
        </article>`;
    }

    function renderPage(idx, keepScroll) {
      currentIndex = idx;
      const page = PAGES_DATA[idx];
      const main = document.getElementById("mainContent");
      const total = page.sections.reduce((acc, s) => acc + s.questions.length, 0);
      let sectionsHtml = "", n = 0;
      page.sections.forEach((sec, secIdx) => {
        sectionsHtml += `<div class="section-banner"><span>${sec.label}</span><span class="chip purple">${sec.questions.length} أسئلة</span></div>`;
        sec.questions.forEach((qItem, qIdx) => { sectionsHtml += cardHtml(page, secIdx, qIdx, qItem, keepScroll ? -1 : Math.min(n++, 8) * 60); });
      });
      const lastId = PAGES_DATA[PAGES_DATA.length - 1].id;
      main.innerHTML = `
        <div class="page-header">
          <div class="page-title-wrap"><h2>${page.title}</h2>
            <div class="sub-meta"><span class="chip">${page.id} من ${lastId}</span><span class="chip purple">${page.meta}</span><span class="chip">${total} سؤال شامل</span><span class="chip">${page.unit}</span></div>
          </div>
          <div class="page-actions">
            <button class="action-btn primary" onclick="revealAllCurrent()">إظهار إجابات الصفحة</button>
            <button class="action-btn" onclick="hideAllCurrent()">إخفاء إجابات الصفحة</button>
          </div>
        </div>
        ${sectionsHtml}
        <div class="bottom-nav">
          <button class="action-btn" ${idx === 0 ? "disabled" : ""} onclick="selectPage(${idx - 1})">→ الصفحة السابقة</button>
          <span class="chip">صفحة ${idx + 1} / ${PAGES_DATA.length}</span>
          <button class="action-btn primary" ${idx === PAGES_DATA.length - 1 ? "disabled" : ""} onclick="selectPage(${idx + 1})">الصفحة التالية ←</button>
        </div>`;
      renderSidebar(document.getElementById("searchInput").value);
      updateStats();
      if (!keepScroll) window.scrollTo({ top: 0, behavior: "smooth" });
    }
    function rerender() { const y = window.scrollY; renderPage(currentIndex, true); window.scrollTo(0, y); }

    function selectPage(idx) { if (idx >= 0 && idx < PAGES_DATA.length) renderPage(idx); }
    function toggleAnswer(uid) { revealedIds.has(uid) ? revealedIds.delete(uid) : revealedIds.add(uid); rerender(); }
    function revealAllCurrent() { pageUids(PAGES_DATA[currentIndex]).forEach(u => revealedIds.add(u)); rerender(); }
    function hideAllCurrent() { pageUids(PAGES_DATA[currentIndex]).forEach(u => revealedIds.delete(u)); rerender(); }

    function findQ(uid) {
      const [pid, si, qi] = uid.split("__");
      return PAGES_DATA.find(p => p.id === pid).sections[+si].questions[+qi];
    }
    function pickChoice(uid, choice, el) {
      if (answered.has(uid) || revealedIds.has(uid)) return;
      const q = findQ(uid);
      const ok = q.type === "mcq" ? choice === q.correctKey : (choice === "T") === q.ansEn.trim().startsWith("✓");
      answered.set(uid, { choice, ok });
      if (ok) {
        streak++; score += 10 + Math.min(streak - 1, 5) * 2;
        const msgs = ["🎉 أحسنت!", "⭐ ممتاز!", "👏 برافو!", "🚀 رائع!", "💯 إجابة صح!"];
        toast(streak >= 3 ? `🔥 ${streak} على التوالي!` : msgs[Math.floor(Math.random() * msgs.length)]);
        const r = el.getBoundingClientRect();
        confetti(r.left + r.width / 2, r.top + r.height / 2, streak >= 3 ? 110 : 60);
        beep(true);
      } else {
        streak = 0; toast("✘ مش دي، شوف الإجابة الصح", true); beep(false);
      }
      rerender();
      if (!ok) { const c = document.getElementById("card-" + uid); c && c.classList.add("missed"); }
      if (pageUids(PAGES_DATA[currentIndex]).every(isDone) && ok) setTimeout(() => { toast("🏆 خلصت الصفحة دي!"); confetti(innerWidth / 2, innerHeight / 3, 200); }, 900);
    }

    function updateStats() {
      const page = PAGES_DATA[currentIndex], us = pageUids(page);
      const d = us.filter(isDone).length;
      const tried = answered.size, okc = [...answered.values()].filter(x => x.ok).length;
      document.getElementById("scoreVal").textContent = score;
      document.getElementById("okVal").textContent = okc;
      document.getElementById("triedVal").textContent = tried;
      document.getElementById("streakVal").textContent = streak;
      document.getElementById("streakBox").classList.toggle("hot", streak >= 3);
      document.getElementById("pageBar").style.width = (us.length ? d / us.length * 100 : 0) + "%";
      document.getElementById("pageTxt").textContent = us.length ? `${d}/${us.length}` : "بدون مفتاح";
      const all = allUids.filter(isDone).length;
      document.getElementById("allBar").style.width = (all / allUids.length * 100) + "%";
      document.getElementById("allTxt").textContent = Math.round(all / allUids.length * 100) + "%";
    }
    function resetScore() { answered.clear(); score = 0; streak = 0; rerender(); }

    let toastT;
    function toast(msg, bad) {
      const t = document.getElementById("toast"); t.textContent = msg; t.className = "show" + (bad ? " bad" : "");
      clearTimeout(toastT); toastT = setTimeout(() => t.className = bad ? "bad" : "", 1400);
    }
    // confetti
    const fx = document.getElementById("fxCanvas"), fctx = fx.getContext("2d"); let parts = [], raf = null;
    function sizeFx() { fx.width = innerWidth; fx.height = innerHeight; }
    addEventListener("resize", sizeFx); sizeFx();
    function confetti(x, y, n) {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const cols = ["#f5c04a", "#ffe08a", "#ffffff", "#34d399", "#60a5fa", "#fb7185"];
      for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 14, vy: -Math.random() * 13 - 3, g: .38, s: 5 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[i % cols.length], life: 90 + Math.random() * 40 });

    function tick() {

    let ac;

    function toggleSound() { soundOn = !soundOn; document.getElementById("sndBtn").textContent = soundOn ? "🔊 صوت" : "🔇 صامت"; }

    function handleSearch(val) { renderSidebar(val); }
    function toggleSidebar() { document.getElementById("appLayout").classList.toggle("sidebar-hidden"); }
    function changeFontSize(delta) { fontScale = Math.min(1.45, Math.max(0.85, +(fontScale + delta).toFixed(2))); document.documentElement.style.setProperty("--font-scale", fontScale); }
    function toggleTheme() { document.body.classList.toggle("light-mode"); }
    function toggleFullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); }

    function startTimer(seconds) {
      stopTimer();
      let rem = seconds;
      const bar = document.getElementById("timerBar"), digits = document.getElementById("timerDigits");
      bar.classList.add("active");
      const upd = () => { digits.textContent = `${String(Math.floor(rem / 60)).padStart(2, "0")}:${String(rem % 60).padStart(2, "0")}`; bar.classList.toggle("low", rem <= 10); };
      upd();
      timerInterval = setInterval(() => { rem--; if (rem <= 0) { upd(); beep(false); stopTimer(); } else upd(); }, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); timerInterval = null; document.getElementById("timerBar").classList.remove("active"); }

    const canvas = document.getElementById("drawCanvas"), ctx = canvas.getContext("2d");
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; ctx.lineWidth = 4; ctx.lineCap = "round"; ctx.strokeStyle = "#ef4444"; }
    window.addEventListener("resize", resizeCanvas); resizeCanvas();
    function togglePen() { penEnabled = !penEnabled; document.getElementById("penBtn").classList.toggle("active", penEnabled); canvas.classList.toggle("drawing-active", penEnabled); }
    function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    canvas.addEventListener("pointerdown", e => { if (!penEnabled) return; isDrawing = true; ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY); });
    canvas.addEventListener("pointermove", e => { if (!penEnabled || !isDrawing) return; ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); });
    window.addEventListener("pointerup", () => { isDrawing = false; });

    function setHdr() { document.documentElement.style.setProperty("--hdr", document.getElementById("topbar").offsetHeight + "px"); }
    addEventListener("resize", setHdr); setHdr(); setTimeout(setHdr, 400);
    renderPage(0);

.cv-item .fix{margin-top:6px;background:rgba(245,197,66,.12);border:1px dashed #f5c542;border-radius:10px;padding:8px 12px;color:#ffe9a8}
.cv-item .fix b{color:#ffe08a}
.cv-good{background:#0e3a2a;border:2px solid #34d399;border-radius:14px;padding:14px;text-align:center;font-weight:800;font-size:19px;color:#a7f3d0}
@media print{
 @page{size:A4 landscape;margin:8mm}
 html,body{background:#fff!important;height:auto!important;overflow:visible!important}
 body>*:not(#cert-ov){display:none!important}
 #cert-ov{position:static!important;display:block!important;background:#fff!important;padding:0!important;overflow:visible!important}
 .cv-bar,.cv-name,.cv-next,.cv-rev{display:none!important}
 .cert{box-shadow:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .cert *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<script id="certjs">
(function(){
 var CFG={"full": true, "label": "مراجعة الصف الرابع الابتدائي"};
 var LOGO='<svg viewBox="0 0 64 64" width="56" height="56"><defs><linearGradient id="clg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#f5a623"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="16" fill="#0b1b4a" stroke="url(#clg)" stroke-width="3"/><text x="32" y="39" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="22" fill="url(#clg)">ICT</text></svg>';
 var LOGO_URI='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(LOGO.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" '));
 function scorable(){return allUids.filter(function(u){var q=findQ(u);return q.type==='mcq'||q.type==='tf';});}
 function stats(){var s=scorable(),ok=0,wrong=[];s.forEach(function(u){var a=answered.get(u);if(a){if(a.ok)ok++;else wrong.push(u);}});return {tot:s.length,ok:ok,wrong:wrong,done:s.filter(isDone).length};}
 function finished(){var st=stats();return st.tot>0&&st.done===st.tot;}
 function esc(t){return String(t==null?'':t);}
 function portrait(){var im=document.querySelector('.brand-block img, header img, img');return im?im.src:'';}
 function msgFor(p){return p>=90?'مستوى ممتاز! استمر بنفس الحماس.':p>=70?'أداء رائع، قليل من التركيز ويصبح ممتازًا.':p>=50?'بداية جيدة، راجع أخطاءك وحاول مرة ثانية.':'المحاولة أول خطوة للنجاح، راجع وحاول من جديد.';}
 var nameVal='';
 function certHtml(){
  var st=stats(),p=st.tot?Math.round(st.ok/st.tot*100):0;
  var nm=nameVal.trim();
  return '<div class="cert"><div class="cert-in"><div class="cert-head">'+LOGO+'<div>أكاديمي ICT<small>ICT ACADEMY</small></div></div>'+
   '<h1>شهادة تقدير</h1><div class="to">تُمنح هذه الشهادة إلى</div><div class="nm" id="cv-nm">'+(nm?nm.replace(/</g,'&lt;'):'&nbsp;')+'</div>'+
   '<div class="for">'+(CFG.full?'تقديرًا لإتمامه ':'تقديرًا لتجربته ')+CFG.label+'</div>'+
   '<div class="sc"><div>'+st.ok+' من '+st.tot+'<span>الإجابات الصحيحة</span></div><div>'+p+'%<span>النسبة</span></div><div>'+score+'<span>النقاط</span></div></div>'+
   '<div class="msg">تهانينا! '+msgFor(p)+'</div>'+
   '<div class="cert-foot"><div class="dt">'+new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'})+'</div><div class="t"><div><b>أ. تامر النجار</b><span>مدرس البرمجة والذكاء الاصطناعي</span></div><img src="'+portrait()+'" alt=""></div></div>'+
   '</div></div>';
 }
 function reviewHtml(){
  if(!CFG.full)return '';
  var st=stats();
  if(!st.wrong.length)return '<div class="cv-rev"><div class="cv-good">🌟 ما فيش أخطاء في الأسئلة اللي جاوبتها. شغل ممتاز!</div></div>';
  var h='<div class="cv-rev"><h2>مراجعة أخطائي ('+st.wrong.length+')</h2>';
  st.wrong.forEach(function(u){
   var q=findQ(u),a=answered.get(u),yr,rt;
   if(q.type==='mcq'){
    var c1=(q.choices||[]).filter(function(c){return c.key===a.choice})[0],c2=(q.choices||[]).filter(function(c){return c.key===q.correctKey})[0];
    yr=a.choice+(c1?') '+c1.text:'');rt=q.correctKey+(c2?') '+c2.text:'');
   }else{yr=a.choice==='T'?'✓ صح':'✗ خطأ';rt=(a.choice==='T')?'✗ خطأ':'✓ صح';}
   var fix=esc(q.ansEn)+(q.ansAr?'<br>'+esc(q.ansAr):'');
   h+='<div class="cv-item"><div class="qq">'+(q.num?q.num+'. ':'')+q.en+'</div>'+(q.ar?'<div class="qa">'+q.ar+'</div>':'')+
    '<div class="yr">إجابتك: '+yr+'</div><div class="ok">الإجابة الصحيحة: '+rt+'</div><div class="fix"><b>التصحيح:</b> '+fix+'</div></div>';
  });
  return h+'</div>';
 }
 function nextHtml(){return CFG.full?'':'<div class="cv-next">للمتابعة: المستوى التالي وباقي الأسئلة متاحة عند أكاديمي ICT</div>';}
 function open(){
  var ov=document.getElementById('cert-ov');
  if(!ov){ov=document.createElement('div');ov.id='cert-ov';document.body.appendChild(ov);}
  var st=stats();
  var warn=(st.done<st.tot)?'<div style="text-align:center;color:#ffe08a;font-weight:700;margin-bottom:6px">باقي '+(st.tot-st.done)+' سؤال لإكمال الاختبار. هذه نتيجتك حتى الآن.</div>':'';
  ov.innerHTML='<div class="cv-wrap">'+warn+'<div class="cv-name"><label for="cv-in" style="color:#ffe08a;font-weight:800">اسم الطالب (اختياري):</label><input id="cv-in" type="text" maxlength="40" placeholder="اكتب اسمك هنا" value="'+nameVal.replace(/"/g,'&quot;')+'"></div>'+
   '<div id="cv-card">'+certHtml()+'</div>'+
   '<div class="cv-bar"><button class="pri" id="cv-print" type="button">🖨️ طباعة / حفظ PDF</button><button id="cv-png" type="button">🖼️ حفظ كصورة</button><button id="cv-again" type="button">↻ ابدأ من جديد</button><button id="cv-close" type="button">✕ رجوع للأسئلة</button></div>'+
   nextHtml()+reviewHtml()+'</div>';
  ov.className='on';
  document.getElementById('cv-in').addEventListener('input',function(e){nameVal=e.target.value;document.getElementById('cv-nm').innerHTML=nameVal.trim()?nameVal.replace(/</g,'&lt;'):'&nbsp;';});
  document.getElementById('cv-print').addEventListener('click',function(){window.print();});
  document.getElementById('cv-close').addEventListener('click',function(){ov.className='';});
  document.getElementById("cv-again").addEventListener("click",function(){shown=false;revealedIds.clear();resetScore();ov.className='';selectPage(0);});
  document.getElementById('cv-png').addEventListener('click',savePng);
  try{confetti(innerWidth/2,innerHeight/3,160);}catch(e){}
 }
 function savePng(){
  var st=stats(),p=st.tot?Math.round(st.ok/st.tot*100):0;
  var W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  function img(src){return new Promise(function(res){var i=new Image();i.onload=function(){res(i)};i.onerror=function(){res(null)};i.src=src;});}
  Promise.all([document.fonts?document.fonts.load('800 40px Cairo'):0,document.fonts?document.fonts.load('900 40px Cairo'):0,img(LOGO_URI),img(portrait())]).then(function(r){
   var lg=r[2],pt=r[3];
   var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fffdf4');g.addColorStop(1,'#fff3cc');x.fillStyle=g;x.fillRect(0,0,W,H);
   x.strokeStyle='#c8921a';x.lineWidth=10;x.strokeRect(34,34,W-68,H-68);x.strokeStyle='#0b1b4a';x.lineWidth=3;x.strokeRect(58,58,W-116,H-116);
   x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
   function T(t,y,f,col){x.font=f+' Cairo, Inter, sans-serif';x.fillStyle=col;x.fillText(t,W/2,y);}
   x.font='900 56px Cairo, sans-serif';var tw=x.measureText('أكاديمي ICT').width;if(lg)x.drawImage(lg,W/2+tw/2+24,100,90,90);
   T('أكاديمي ICT',146,'900 56px','#0b1b4a');
   T('شهادة تقدير',290,'900 120px','#b07d0e');
   T('تُمنح هذه الشهادة إلى',390,'700 40px','#444');
   var nm=nameVal.trim()||'';
   if(nm)T(nm,480,'900 84px','#0b1b4a');
   x.strokeStyle='#c8921a';x.lineWidth=4;x.setLineDash([4,10]);x.beginPath();x.moveTo(380,535);x.lineTo(W-380,535);x.stroke();x.setLineDash([]);
   T((CFG.full?'تقديرًا لإتمامه ':'تقديرًا لتجربته ')+CFG.label,610,'800 46px','#0b1b4a');
   x.fillStyle='#0b1b4a';x.beginPath();x.roundRect?x.roundRect(W/2-420,670,840,140,28):x.rect(W/2-420,670,840,140);x.fill();
   T(st.ok+' من '+st.tot,730,'900 62px','#ffe08a');
   x.font='700 28px Cairo, sans-serif';x.fillStyle='#c9d4ff';x.fillText('الإجابات الصحيحة  •  '+p+'%  •  '+score+' نقطة',W/2,785);
   T('تهانينا! '+msgFor(p),880,'800 42px','#14306e');
   if(pt){x.save();x.beginPath();x.arc(W-200,985,62,0,Math.PI*2);x.closePath();x.clip();var s=Math.min(pt.width,pt.height);x.drawImage(pt,(pt.width-s)/2,(pt.height-s)/2,s,s,W-262,923,124,124);x.restore();x.strokeStyle='#c8921a';x.lineWidth=6;x.beginPath();x.arc(W-200,985,62,0,Math.PI*2);x.stroke();}
   x.textAlign='right';x.font='900 38px Cairo, sans-serif';x.fillStyle='#0b1b4a';x.fillText('أ. تامر النجار',W-290,965);
   x.font='700 26px Cairo, sans-serif';x.fillStyle='#555';x.fillText('مدرس البرمجة والذكاء الاصطناعي',W-290,1008);
   x.textAlign='left';x.font='700 28px Cairo, sans-serif';x.fillText(new Date().toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'}),130,1000);
   c.toBlob(function(b){var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ICT-certificate.png';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},500);},'image/png');
  });
 }
 var fab=document.createElement('button');fab.id='certfab';fab.type='button';fab.textContent='🏆 شهادتي';fab.addEventListener('click',open);document.body.appendChild(fab);
 var shown=false,_pc=pickChoice;
 pickChoice=function(){_pc.apply(this,arguments);if(!shown&&finished()){shown=true;setTimeout(open,1500);}};
 window.__cert={open:open,stats:stats,finished:finished};
})();
</script>
</body>
